<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的GitHub域名网站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            text-align: center;
            padding-top: 100px;
        }
        .box {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 2px 10px #ddd;
            max-width: 500px;
            margin: 0 auto;
        }
        h1 {
            color: #222;
            margin-bottom: 20px;
        }
        p {
            color: #666;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>🎉 域名绑定成功</h1>
        <p>你的自定义域名已经可以正常访问网站了</p>
        <p style="margin-top:15px;">部署在 GitHub Pages</p>
    </div>
</body>
</html>
